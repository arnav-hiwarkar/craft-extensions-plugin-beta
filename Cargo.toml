[workspace]
resolver = "3"
members = ["crates/ext-cli", "crates/ext-ui", "crates/ext-core", "crates/ext-host", "crates/ext-store", "crates/guest"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/Jeremy8776/craft-extensions"

[workspace.dependencies]
craft-ext-core = { path = "crates/ext-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

# No default features: native roots via the platform verifier, no webpki-roots (CDLA licence is not on the house allowlist).
ureq = { version = "3.5", default-features = false, features = ["rustls-no-provider", "_ring", "gzip", "platform-verifier"] }
ed25519-dalek = "2"
hex = "0.4"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
