[package]
name = "craft-ext-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "craft-ext"
path = "src/main.rs"

[dependencies]
craft-ext-core.workspace = true
craft-ext-store = { path = "../ext-store", features = ["net"] }
craft-ext-host = { path = "../ext-host" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
ureq.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }
getrandom = "0.4"

[dev-dependencies]
tempfile = "3.27.0"
