[package]
name = "craft-ext-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
[lints]
workspace = true
[dependencies]
craft-ext-core.workspace = true
craft-ext-store = { path = "../ext-store", features = ["net"] }
egui = { version = "0.37", default-features = false }
serde_json.workspace = true

[features]
# Compatibility marker for framework integration. Hosts install an Engine through
# PluginUi::set_framework_engine; without one, Framework falls back to egui.
framework = []

[dev-dependencies]
# Headless renderer tests lay out text, which needs egui's bundled fonts.
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
