[package]
name = "bench-host"
version = "0.1.0"
edition = "2024"
[dependencies]
wasmtime = { version = "50", default-features = false, features = ["cranelift", "runtime", "std", "component-model", "pulley"] }
wasmi = { version = "2.0.1" }
wit-component = "*"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
[profile.release]
opt-level = 3
[workspace]
