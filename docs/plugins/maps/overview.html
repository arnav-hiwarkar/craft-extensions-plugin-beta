<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Craft plugin workflow atlas</title>
<style>
*{box-sizing:border-box}body{margin:0;color:var(--foreground,CanvasText);font:15px/1.5 var(--font-sans,system-ui)}h2{font-size:19px;margin:0 0 12px}h3{font-size:15px;margin:0 0 5px}p{margin:0 0 12px}a{color:var(--primary,LinkText)}.muted{font-size:13px;color:var(--muted-foreground,GrayText)}.tabs,.links{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 18px}.tabs button{font:inherit;cursor:pointer;padding:7px 10px;background:var(--secondary,ButtonFace);color:var(--foreground,ButtonText);border:1px solid var(--border,ButtonBorder);border-radius:var(--radius,8px)}.tabs button[aria-selected=true]{background:var(--primary,Highlight);color:var(--primary-foreground,HighlightText)}button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--ring,Highlight);outline-offset:3px}.hub,.node,.card{padding:16px;border:1px solid var(--border,ButtonBorder);border-radius:var(--radius,9px);background:var(--card,Canvas)}.hub{max-width:470px;margin:auto;text-align:center;border-color:var(--primary,Highlight)}.hub strong{font-size:17px}.arrow{text-align:center;padding:6px;line-height:1;color:var(--muted-foreground,GrayText)}.branches{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.branches.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card summary{font-weight:650;cursor:pointer}.card .caption{display:block;font-size:13px;font-weight:400;color:var(--muted-foreground,GrayText);margin-top:4px}.card ul{padding-left:18px;font-size:13px}.card li{margin:5px 0}.card a{font-size:13px}.node strong{display:block}.node p,.card p{font-size:13px;margin:5px 0 0;color:var(--muted-foreground,GrayText)}.flow{max-width:630px;margin:auto}.note{font-size:13px;margin:16px 0;padding:10px 14px;border-left:3px solid var(--warning,ButtonBorder);background:var(--secondary,ButtonFace)}.links{font-size:13px}.footer{border-top:1px solid var(--border,ButtonBorder);padding-top:14px;margin-top:18px}[hidden]{display:none!important}@media(max-width:520px){.branches,.branches.two{grid-template-columns:1fr}.tabs button{font-size:13px;padding:6px 9px}.hub,.node,.card{padding:14px}}@media print{.tabs{display:none}.panel[hidden]{display:block!important}.panel{margin-bottom:24px}}
</style>
</head>
<body>
<p>A shared plugin platform for EffectCraft, PhotoCraft and FigCraft. Choose a workflow, or expand a role to find its guide.</p>
<div class="tabs" role="tablist" aria-label="Plugin workflow maps"></div>
<main id="panels"></main>
<div class="footer">
<p class="muted">These maps explain source contracts. They do not claim every GUI or platform path has been tested.</p>
<div class="links"><a data-doc="maps.md">Ten Mermaid maps</a><a data-doc="coverage.md">Coverage and source</a><a data-doc="cli-reference.md">CLI</a><a data-doc="native-protocol.md">Native protocol</a><a data-doc="framework-integration.md">Framework handoff</a></div>
</div>
<script>
const base='https://github.com/arnav-hiwarkar/craft-extensions-plugin-beta/blob/plugin-beta/docs/plugins/';
const roles=[
['Use plugins','Discover → install → consent → run',['App manager, launcher or CLI','Required and optional grants','Pin, rollback, revoke and Resume','Missing-plugin project choices'],'user-guide.md'],
['Make plugins','Manifest → SDK → check → package',['Wasm effects and sessions','Consented native helpers','Forms, panels, tools and canvas','Multi-app contributions'],'author-guide.md'],
['Add an app','Adapter → engine → scopes → history',['Canonical operations and permissions','Worker-to-owner bridge','Project and export safety','Shared renderer and manager'],'adapter-guide.md'],
['Maintain the store','Identity → listing → signing → reports',['Authors host GitHub Releases','One-maintainer admission','Signed metadata and digests','Manual report triage and kill list'],'store-and-distribution.md'],
['Keep compatibility','Contracts, ABI, UI and state',['App contracts decide availability','UI 1.0 remains supported','Components keep fallbacks','Host controls framework and theme'],'formats-and-versioning.md'],
['Verify behavior','Source → tests → artifacts → GUI',['Record exact runs and revisions','Separate CLI, GUI and GPU evidence','Use an isolated catalogue and store','Document failures and deferrals'],'installation-and-testing.md']
];
const workflows=[
{id:'mindmap',label:'Mind map',title:'',nodes:[],note:'Deferred: app accounts/reviews, Wasm network/clipboard/storage APIs, theme activation and native OS confinement. A permission name does not mean every app implements an operation.'},
{id:'install',label:'Install & consent',title:'Install without silently granting access',nodes:[
['Discover a compatible contribution','Verify the signed catalogue, freshness, app contracts and platform. Explain unavailable contributions.'],
['Install verified bytes','Resolve dependencies. Verify archive size, digest and manifest. Add no new enablement or grants.'],
['Review setup and permissions','Choose contributions, grant required rights and decide optional rights. Native versions also need separate full-computer consent.'],
['Enable only when access is complete','Otherwise keep the contribution disabled and explain missing access. Enablement and grants belong to this app.']
],note:'Native helpers have ordinary account access outside host calls. They are not an OS sandbox. Installation alone never implies native consent.'},
{id:'runtime',label:'Runtime & Undo',title:'One event, controlled app operations',nodes:[
['Capture an invocation and begin','The owner validates current access and document scope, then opens a history group. The guest runs on a worker.'],
['Authorize every host call','Known operation + bounded arguments + declared rights + live grants + captured scope. Unknown IDs never become arbitrary CLI dispatch.'],
['Use the canonical engine','Queries return data. Edits use normal validation, locks and history. The guest may handle recoverable operation errors.'],
['Finalize or roll back','Recheck validity. Success commits document/history and publishes staged UI. Failure, stale scope or revocation rolls them back. A tool gesture is one Undo step.']
],note:'External effects have another boundary: PhotoCraft publishes files one at a time, so earlier files can remain after failure. Native external effects are not reversed by document Undo.'},
{id:'ui',label:'UI & framework',title:'The plugin describes UI; the host draws it',nodes:[
['Send a versioned tree and draw list','Use stable widget IDs and the UI level carried by the session contract.'],
['Validate and publish a revision','Refuse invalid known nodes. Keep component fallbacks. Publish only after a successful event.'],
['Draw through the host renderer','The host installs a framework Engine or uses egui fallback. It owns theme, fonts, accessibility and focus.'],
['Dispatch current control events','Events carry the drawn revision. Reject stale or closed-surface replies, then route them to the owner with live permission checks.']
],note:'Guests cannot select or detect the renderer. Framework adoption is a host change. Theme activation is deferred and must use craft-libs’ canonical parser/store.'},
{id:'projects',label:'Projects & updates',title:'Preserve data across missing plugins and versions',nodes:[
['Check recorded project contributions','Compare installed release, app contract, saved state and per-app setup.'],
['Ask before installation or enablement','Open without keeps saved data and placeholders. Do not silently download or grant access.'],
['Refuse unsafe final export','Preview may pass through a missing rendering contribution. Final output refuses when it requires that contribution.'],
['Review updates and rollback','Pins constrain candidates. New rights/native-version consent keep an update pending. Rollback still checks access and state, preserving newer saved data.']
],note:'PhotoCraft’s current plugin filters bake pixels and create no missing-filter prompt. Opaque per-instance state migration and native external-effect rollback are not promised.'}
];
function element(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text)e.textContent=text;return e;}
const tabbar=document.querySelector('.tabs'),panels=document.getElementById('panels');
for(let i=0;i<workflows.length;i++){
 const w=workflows[i],button=element('button','',w.label);button.id='tab-'+w.id;button.setAttribute('role','tab');button.setAttribute('aria-controls',w.id);button.setAttribute('aria-selected',String(i===0));button.tabIndex=i===0?0:-1;tabbar.append(button);
 const panel=element('section','panel');panel.id=w.id;panel.setAttribute('role','tabpanel');panel.setAttribute('aria-labelledby',button.id);panel.hidden=i!==0;
 if(i===0){
  const hub=element('div','hub');hub.append(element('strong','','Versioned contracts'),element('div','muted','One shared platform · one adapter per app · host-owned UI'));panel.append(hub,element('div','arrow','↓'));
  const branches=element('div','branches');
  for(const role of roles){const card=element('details','card'),summary=element('summary','',role[0]);summary.append(element('span','caption',role[1]));card.append(summary);const list=element('ul');for(const item of role[2])list.append(element('li','',item));const link=element('a','','Open guide');link.dataset.doc=role[3];card.append(list,link);branches.append(card);}panel.append(branches);
 }else{
  panel.append(element('h2','',w.title));const flow=element('div','flow');w.nodes.forEach((n,j)=>{if(j)flow.append(element('div','arrow','↓'));const node=element('div','node');node.append(element('strong','',n[0]),element('p','',n[1]));flow.append(node);});panel.append(flow);
 }
 panel.append(element('div','note',w.note));panels.append(panel);
}
for(const a of document.querySelectorAll('[data-doc]')){a.href=base+a.dataset.doc;a.target='_blank';a.rel='noopener noreferrer';}
const tabs=[...document.querySelectorAll('[role=tab]')];
function select(tab){for(const t of tabs){const on=t===tab;t.setAttribute('aria-selected',String(on));t.tabIndex=on?0:-1;document.getElementById(t.getAttribute('aria-controls')).hidden=!on;}}
for(const tab of tabs){tab.addEventListener('click',()=>select(tab));tab.addEventListener('keydown',e=>{let n=tabs.indexOf(tab);if(e.key==='ArrowRight')n=(n+1)%tabs.length;else if(e.key==='ArrowLeft')n=(n+tabs.length-1)%tabs.length;else if(e.key==='Home')n=0;else if(e.key==='End')n=tabs.length-1;else return;e.preventDefault();select(tabs[n]);tabs[n].focus();});}
</script>
</body>
</html>
