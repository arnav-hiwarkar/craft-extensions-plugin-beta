schema = 2
id = "io.github.arnav-hiwarkar.halftone"
name = "Halftone"
version = "1.0.0"
license = "MIT OR Apache-2.0"
source = "https://github.com/arnav-hiwarkar/halftone"
summary = "Round halftone dots on a rotated grid, sized by local darkness"
apps = ["effectcraft", "photocraft", "figcraft"]

[[contribution]]
id = "halftone"
kind = "effect"
contract = "raster.filter@1.0"
label = "Halftone"
category = "Stylize"
module = "halftone.wasm"
permissions = []

[contribution.form]
schema = 1
key = "halftone"
title = "Halftone"

[contribution.form.preview]
enabled = true
compare = true

[[contribution.form.params]]
key = "size"
label = "Dot size"
unit = "pixels"
[contribution.form.params.kind]
type = "range"
default = 8
min = 2
max = 64

[[contribution.form.params]]
key = "angle"
label = "Grid angle"
unit = "degrees"
[contribution.form.params.kind]
type = "angle"
default = 45

[[contribution.form.params]]
key = "mono"
label = "Black and white"
[contribution.form.params.kind]
type = "bool"
default = true
