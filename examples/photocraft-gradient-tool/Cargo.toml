[package]
name = "photocraft_gradient_tool"
version = "1.0.0"
description = "PhotoCraft Gradient Ramp: a pointer tool that draws linear, radial and reflected gradients with a live guide (example plugin)."
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
craft-guest = { path = "../../crates/guest" }

